<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>컴싸친구 - CS Tutor Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="notebook-container">

      <!-- Spiral Binding Column -->
      <div class="binding-col" aria-hidden="true"></div>

      <!-- Main Content Column -->
      <div class="content-col">

        <!-- Header -->
        <header class="notebook-header">
          <div class="header-left">
            <div class="logo-placeholder">
              <img src="logo.png" alt="컴싸친구 로고" class="logo-img" />
            </div>
            <div class="header-text">
              <h1 class="handwriting-title">컴싸친구</h1>
              <p class="header-subtitle">CS Friend · Your Computer Science Tutor</p>
            </div>
          </div>
          <button class="eraser-button" id="clearBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            Clear
          </button>
        </header>

        <!-- Paper / Chat Area -->
        <main class="notebook-paper" id="chatArea">
          <div class="notebook-lines" aria-hidden="true"></div>
          <div class="red-margin" aria-hidden="true"></div>

          <div class="messages-wrap">
            <div class="messages-container" id="chat-window" aria-live="polite">
              <div class="empty-state" id="emptyState">
                <span class="empty-icon">📝</span>
                <p class="empty-main">Ask me anything about Computer Science!</p>
                <p class="empty-sub">Try: "What is a Process?" or "What is an Algorithm?"</p>
              </div>
            </div>
            <div id="messagesEnd"></div>
          </div>
        </main>

        <!-- Footer / Input -->
        <footer class="notebook-footer">
          <div class="input-row">
            <input
              type="text"
              id="user-input"
              placeholder="Ask about CS topics… (Process, Algorithm, OS, Network, Stack…)"
              autocomplete="off"
            />
            <button class="send-button" type="button" id="sendBtn" onclick="sendMessage()" aria-label="Send">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </div>
        </footer>

      </div><!-- /.content-col -->
    </div><!-- /.notebook-container -->
  </div><!-- /.page-wrapper -->

  <script src="script.js"></script>
</body>
</html>
