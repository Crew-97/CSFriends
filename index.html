<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>SSAFY AI 챗봇</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <div class="header">
            <span>SSAFY 규정 봇</span>
            <button class="upload-btn" onclick="toggleUpload()">문서 추가</button>
        </div>

        <!-- 업로드 패널 -->
        <!-- ※ Step 2 핵심: JS 없이 HTML form으로 파일 업로드! -->
        <div id="upload-panel" class="upload-panel">
            <div class="upload-content">
                <p>새 문서를 업로드하면 챗봇이 해당 내용도 학습합니다.</p>
                <p class="file-types">지원 형식: .txt, .md, .pdf</p>

            </div>
        </div>

        <div id="chat-window" class="chat-window">
            <div class="message bot">안녕하세요! 궁금한 점을 물어보세요.</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="질문을 입력하세요...">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <!-- [Step 0 시작점] script.js 를 먼저 연결하고 fetch 로 /chat 테스트 -->
    <!-- 이후 Step 1~4 를 완성하면서 아래 주석을 순차 해제하세요 -->
    <script src="script.js"></script>
    <!-- <script src="script_v1.js"></script> -->
    <!-- <script src="script_v2.js"></script> -->
    <!-- <script src="script_v3.js"></script> -->
    <!-- <script src="script_v4.js"></script> -->
</body>

</html>
